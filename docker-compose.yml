version: "3.9"

services:
  grpc-server-1:
    build: ./server

  grpc-server-2:
    build: ./server

  grpc-server-3:
    build: ./server

  nginx:
    image: nginx:latest
    ports:
      - "5000:5000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - grpc-server-1
      - grpc-server-2
      - grpc-server-3