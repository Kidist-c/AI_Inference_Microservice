version: "3.9"

# ─── Shared build context for all gRPC server instances ───────────────────────
x-server-base: &server-base
  build:
    context: .
    dockerfile: server/Dockerfile
  environment:
    OLLAMA_URL:   "http://host.docker.internal:11434"
    OLLAMA_MODEL: "tinyllama"
  extra_hosts:
    - "host.docker.internal:host-gateway"   # lets containers reach host Ollama
  restart: unless-stopped
  networks:
    - grpc-net

services:

  # ── Three identical gRPC backend instances ───────────────────────────────────
  grpc-server-1:
    <<: *server-base
    container_name: grpc-server-1
    environment:
      OLLAMA_URL:   "http://host.docker.internal:11434"
      OLLAMA_MODEL: "tinyllama"
      SERVER_ID:    "server-1"
      GRPC_PORT:    "50051"

  grpc-server-2:
    <<: *server-base
    container_name: grpc-server-2
    environment:
      OLLAMA_URL:   "http://host.docker.internal:11434"
      OLLAMA_MODEL: "tinyllama"
      SERVER_ID:    "server-2"
      GRPC_PORT:    "50051"

  grpc-server-3:
    <<: *server-base
    container_name: grpc-server-3
    environment:
      OLLAMA_URL:   "http://host.docker.internal:11434"
      OLLAMA_MODEL: "tinyllama"
      SERVER_ID:    "server-3"
      GRPC_PORT:    "50051"

  # ── Nginx Layer-7 load balancer ──────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: grpc-nginx
    ports:
      - "80:80"           # expose to host so the CLI client can reach it
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - grpc-server-1
      - grpc-server-2
      - grpc-server-3
    restart: unless-stopped
    networks:
      - grpc-net

networks:
  grpc-net:
    driver: bridge
