syntax = "proto3";

package ai_inference;

// ─── Request / Response Messages ───────────────────────────────────────────

message SentimentRequest {
  string text = 1;
}

message SentimentResponse {
  string label      = 1;   // e.g. "POSITIVE", "NEGATIVE", "NEUTRAL"
  float  confidence = 2;   // 0.0 – 1.0
}

message GenerateRequest {
  string prompt = 1;
}

message GenerateChunk {
  string token = 1;         // one streamed token / word-piece
}

message TextChunk {
  string content = 1;       // a piece of a large document
}

message SummaryResponse {
  string summary = 1;
}

message ChatMessage {
  string role    = 1;       // "user" or "assistant"
  string content = 2;
}

// ─── Service Definition ────────────────────────────────────────────────────

service AIInference {

  //  – Unary: send one text, get one sentiment result
  rpc AnalyzeSentiment (SentimentRequest) returns (SentimentResponse);

  //  – Server-streaming: send one prompt, get a stream of tokens
  rpc GenerateText (GenerateRequest) returns (stream GenerateChunk);

  // – Client-streaming: send many text chunks, get one summary
  rpc SummarizeDocument (stream TextChunk) returns (SummaryResponse);

  //  – Bidirectional-streaming: live chat
  rpc LiveChat (stream ChatMessage) returns (stream ChatMessage);
}
