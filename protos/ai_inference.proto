syntax = "proto3";

package ai;

service AIInference {
  rpc AnalyzeSentiment (SentimentRequest) returns (SentimentResponse);

  rpc GenerateStream (GenerationRequest) returns (stream TokenResponse);

  rpc SummarizeStream (stream TextChunk) returns (SummaryResponse);

  rpc Chat (stream ChatMessage) returns (stream ChatMessage);
}

message SentimentRequest {
  string text = 1;
}

message SentimentResponse {
  string label = 1;
  float confidence = 2;
}

message GenerationRequest {
  string prompt = 1;
}

message TokenResponse {
  string token = 1;
}

message TextChunk {
  string chunk = 1;
}

message SummaryResponse {
  string summary = 1;
}

message ChatMessage {
  string role = 1;
  string content = 2;
}