# nginx/nginx.conf
# Nginx configured for HTTP/2 + gRPC round-robin load balancing

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Upstream pool: 3 backend gRPC servers ─────────────────────────────
    upstream grpc_backends {
        # Round-robin is the default – no directive needed
        server grpc-server-1:50051;
        server grpc-server-2:50051;
        server grpc-server-3:50051;

        # Keep-alive connections to backends (important for HTTP/2)
        keepalive 32;
    }

    # ── Logging ────────────────────────────────────────────────────────────
    log_format grpc_json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"client":"$remote_addr",'
            '"uri":"$uri",'
            '"upstream":"$upstream_addr",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time'
        '}';

    access_log /var/log/nginx/access.log grpc_json;
    error_log  /var/log/nginx/error.log  warn;

    # ── gRPC reverse-proxy server ──────────────────────────────────────────
    server {
        listen 80 http2;   # Accept HTTP/2 (required for gRPC)

        location / {
            # Forward to the upstream pool using the gRPC protocol
            grpc_pass grpc://grpc_backends;

            # Required headers for gRPC
            grpc_set_header Host            $host;
            grpc_set_header X-Real-IP       $remote_addr;
            grpc_set_header X-Server-ID     $upstream_addr;

            # Increase timeouts for streaming RPCs
            grpc_read_timeout  300s;
            grpc_send_timeout  300s;
            grpc_connect_timeout 5s;

            # Handle gRPC-specific error codes
            error_page 502 = /error502grpc;
        }

        location = /error502grpc {
            internal;
            default_type application/grpc;
            add_header grpc-status 14;   # UNAVAILABLE
            add_header content-length 0;
            return 204;
        }
    }
}
